# Build Ubuntu VKS node qcow2 + optional GHCR containerDisk push.
name: build-ubuntu-node

on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: Kubernetes patch version (re-check VERSIONS.md / stable.txt before dispatch)
        required: true
        default: "1.36.5"
      push:
        description: Push containerDisk to GHCR
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "images/ubuntu-node/**"
      - "containerdisk/**"
      - "Makefile"
      - ".github/workflows/build-ubuntu-node.yaml"

permissions:
  contents: read
  packages: write

env:
  KUBERNETES_VERSION: ${{ inputs.kubernetes_version || '1.36.5' }}

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.14.2"

      - name: Install QEMU + ISO tools
        run: |
          sudo apt-get update -y
          # xorriso: Packer qemu cd_files (cloud-init cidata)
          # ovmf: Ubuntu cloudimg UEFI (firmware = "efi")
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso ovmf

      - name: Packer init + validate
        working-directory: images/ubuntu-node
        run: |
          packer init .
          packer validate -var "kubernetes_version=${KUBERNETES_VERSION}" ubuntu-node.pkr.hcl

      - name: Packer build
        working-directory: images/ubuntu-node
        env:
          PACKER_LOG: "1"
        run: |
          set -euo pipefail
          # Packer QEMU requires the output directory to NOT exist.
          rm -rf ../../out/ubuntu-node

          # GHA often has /dev/kvm present but unusable (Permission denied).
          ACCEL=tcg
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=kvm
          else
            echo "No usable /dev/kvm — using accelerator=tcg (slow)"
          fi

          # Prefer 4M OVMF; fall back to classic names on older packages.
          EFI_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          EFI_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          if [ ! -f "$EFI_CODE" ]; then
            EFI_CODE=/usr/share/OVMF/OVMF_CODE.fd
            EFI_VARS=/usr/share/OVMF/OVMF_VARS.fd
          fi
          ls -la "$EFI_CODE" "$EFI_VARS"

          packer build \
            -var "kubernetes_version=${KUBERNETES_VERSION}" \
            -var "output_directory=../../out/ubuntu-node" \
            -var "accelerator=${ACCEL}" \
            -var "efi_firmware_code=${EFI_CODE}" \
            -var "efi_firmware_vars=${EFI_VARS}" \
            ubuntu-node.pkr.hcl
          ls -lh ../../out/ubuntu-node/
      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-node-${{ env.KUBERNETES_VERSION }}
          path: out/ubuntu-node/*.qcow2
          if-no-files-found: error
          retention-days: 14

  containerdisk:
    needs: packer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.push == true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download qcow2
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ubuntu-node-${{ env.KUBERNETES_VERSION }}
          path: out/ubuntu-node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containerDisk
        run: |
          set -euo pipefail
          DISK=$(ls out/ubuntu-node/*.qcow2 | head -1)
          # Never leave a directory named ubuntu-node.qcow2 (cp into dir → broken OCI layout).
          rm -rf containerdisk/ubuntu-node.qcow2
          test -f "$DISK"
          cp "$DISK" containerdisk/ubuntu-node.qcow2
          test -f containerdisk/ubuntu-node.qcow2
          IMAGE="ghcr.io/virtfoundry/node-ubuntu:${KUBERNETES_VERSION}"
          docker build -t "$IMAGE" -f containerdisk/Dockerfile \
            --build-arg DISK_SRC=ubuntu-node.qcow2 containerdisk/
          # Gate: KubeVirt needs a regular file at /disk/disk.img (not a directory).
          CID=$(docker create "$IMAGE" /disk/disk.img)
          LAYOUT=$(docker export "$CID" | tar -tvf - | grep ' disk/' || true)
          docker rm "$CID" >/dev/null
          echo "$LAYOUT"
          echo "$LAYOUT" | grep -E '^-rw.* disk/disk\.img$' >/dev/null \
            || { echo "FATAL: expected regular file disk/disk.img"; exit 1; }
          if echo "$LAYOUT" | grep -E '^d.* disk/ubuntu-node\.qcow2' >/dev/null; then
            echo "FATAL: disk/ubuntu-node.qcow2 must not be a directory"
            exit 1
          fi
          docker push "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          echo "Pushed $IMAGE"
          echo "Record digest in Template allowlist: ${IMAGE}@${DIGEST:-see-ghcr}"
          rm -f containerdisk/ubuntu-node.qcow2
