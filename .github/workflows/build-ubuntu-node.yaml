# Build Ubuntu VKS node qcow2 + optional GHCR containerDisk push.
name: build-ubuntu-node

on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: Kubernetes patch version (re-check VERSIONS.md / stable.txt before dispatch)
        required: true
        default: "1.36.5"
      push:
        description: Push containerDisk to GHCR
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "images/ubuntu-node/**"
      - "containerdisk/**"
      - "Makefile"
      - ".github/workflows/build-ubuntu-node.yaml"

permissions:
  contents: read
  packages: write

env:
  KUBERNETES_VERSION: ${{ inputs.kubernetes_version || '1.36.5' }}

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.14.2"

      - name: Install QEMU
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Packer init + validate
        working-directory: images/ubuntu-node
        run: |
          packer init .
          packer validate -var "kubernetes_version=${KUBERNETES_VERSION}" ubuntu-node.pkr.hcl

      - name: Packer build
        working-directory: images/ubuntu-node
        run: |
          mkdir -p ../../out/ubuntu-node
          # Nested virt on GHA is best-effort; fall back to tcg if kvm missing.
          if [ ! -e /dev/kvm ]; then
            echo "No /dev/kvm — editing accelerator to none for this runner"
            # Packer qemu: accelerator none uses tcg (slow but works)
            sed -i 's/accelerator = "kvm"/accelerator = "none"/' ubuntu-node.pkr.hcl
          fi
          packer build \
            -var "kubernetes_version=${KUBERNETES_VERSION}" \
            -var "output_directory=../../out/ubuntu-node" \
            ubuntu-node.pkr.hcl

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-node-${{ env.KUBERNETES_VERSION }}
          path: out/ubuntu-node/*.qcow2
          if-no-files-found: error
          retention-days: 14

  containerdisk:
    needs: packer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.push == true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download qcow2
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: ubuntu-node-${{ env.KUBERNETES_VERSION }}
          path: out/ubuntu-node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containerDisk
        run: |
          set -euo pipefail
          DISK=$(ls out/ubuntu-node/*.qcow2 | head -1)
          cp "$DISK" containerdisk/ubuntu-node.qcow2
          IMAGE="ghcr.io/virtfoundry/node-ubuntu:${KUBERNETES_VERSION}"
          docker build -t "$IMAGE" -f containerdisk/Dockerfile \
            --build-arg DISK_SRC=ubuntu-node.qcow2 containerdisk/
          docker push "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          echo "Pushed $IMAGE"
          echo "Record digest in Template allowlist: ${IMAGE}@${DIGEST:-see-ghcr}"
